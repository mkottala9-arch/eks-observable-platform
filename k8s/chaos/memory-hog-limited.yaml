# same 6G stress but capped at 512Mi
# dies in about a second, node memory doesnt move
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog-limited
  namespace: manual-managed
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      args: ["stress", "--vm", "1", "--vm-bytes", "6G", "--vm-hang", "300"]
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 512Mi