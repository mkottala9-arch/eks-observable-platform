# 6G stress with no limits - this is what took the node to 95% in incident 1
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog-unbounded
  namespace: manual-managed
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      args: ["stress", "--vm", "1", "--vm-bytes", "6G", "--vm-hang", "300"]