apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: manual-managed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: stress
          image: polinux/stress
          args: ["stress", "--vm", "1", "--vm-bytes", "6G", "--vm-hang", "300"]
