# added requests/limits after the oom incident
# actual usage is around ~13Mi so 64Mi request is comfortable, 256Mi cap is plenty
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: manual-managed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.14.1 # using 6.14.1 for the fault injection endpoint
          ports:
            - containerPort: 9898
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi