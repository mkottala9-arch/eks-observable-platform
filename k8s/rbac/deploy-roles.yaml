# AmazonEKSEditPolicy covers built-in kubernetes resources only. ServiceMonitor
# is a CRD installed by kube-prometheus-stack, so AWS's managed policy knows
# nothing about it and grants no access.
#
# Applied by an admin at cluster setup time - the deploy roles are namespace
# scoped and deliberately cannot create RBAC objects. a role that can grant
# permissions can escalate itself.
#
# The subject is the GROUP set in the access entry's kubernetes_groups, not the
# username. usernames contain the session name, which changes per assume-role.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: servicemonitor-editor
  namespace: app-dev
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployers-servicemonitor
  namespace: app-dev
subjects:
  - kind: Group
    name: app-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: servicemonitor-editor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: servicemonitor-editor
  namespace: app-prod
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployers-servicemonitor
  namespace: app-prod
subjects:
  - kind: Group
    name: app-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: servicemonitor-editor
  apiGroup: rbac.authorization.k8s.io