name: deploy-dev

# chained to release. runs only after release.yml completes.
# a merge to main alone doesn't deploy - there'd be no new image to deploy.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires whether the upstream succeeded OR failed,
    # so this guard is required - without it a failed build would deploy.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # checkout the commit release.yml built, not the tip of main
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: resolve the version that was just released
        id: meta
        run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT

      - name: assume the dev-deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::756808989597:role/eks-observable-platform-dev-deploy
          aws-region: ap-south-2

      - name: build kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-2 \
            --name eks-observable-platform

      - uses: azure/setup-helm@v4

      - name: deploy
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          helm upgrade --install app-dev ./application/helm \
            -f ./application/helm/values-dev.yaml \
            --set image.tag=$VERSION \
            --namespace app-dev \
            --wait \
            --timeout 5m

          echo "deployed $VERSION to app-dev" >> $GITHUB_STEP_SUMMARY

      # --wait above only proves pods reached Ready. it says nothing about
      # whether the app actually works - a FAULT_MODE=true release passes it
      # perfectly. this is the check that hits / like a real client.
      - name: smoke test
        run: |
          NS=app-dev
          TARGET="http://app-dev.$NS.svc.cluster.local:8080"

          # job names must be unique, so clear any previous run
          kubectl delete job k6-smoke -n $NS --ignore-not-found

          # create-or-update, since the configmap may already exist
          kubectl create configmap k6-smoke-script \
            --from-file=k6/smoke.js -n $NS \
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s|PLACEHOLDER|$TARGET|" k6/smoke-job.yaml \
            | kubectl apply -n $NS -f -

          # capture the result instead of letting a failure kill the step,
          # so the logs still get printed below
          kubectl wait --for=condition=complete job/k6-smoke -n $NS --timeout=120s \
            && RESULT=pass || RESULT=fail

          echo "--- k6 output ---"
          kubectl logs job/k6-smoke -n $NS

          if [ "$RESULT" = "fail" ]; then
            echo "::error::smoke test failed - the deployed release is not serving correctly"
            exit 1
          fi

          echo "smoke test passed" >> $GITHUB_STEP_SUMMARY