name: promote

# manual only. you choose which tested version goes to prod.
# nothing is built here - the image already exists, verified in dev.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote to prod (e.g. v1.5.0)'
        required: true

permissions:
  id-token: write
  contents: read

# Only one production promotion may modify app-prod at a time.
# A later manual dispatch waits for the active promotion to finish instead
# of racing its Helm upgrade, validation gates, or recovery step.
concurrency:
  group: app-prod-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    # this line is what makes github pause for approval. and because
    # prod-deploy's trust policy requires sub to contain
    # environment:production, removing it wouldn't skip the gate - it would
    # produce a token AWS refuses.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: assume the prod-deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::756808989597:role/eks-observable-platform-prod-deploy
          aws-region: ap-south-2

      # fail early if the tag doesn't exist, rather than discovering it
      # as an ImagePullBackOff after the deploy has already started.
      - name: verify the image exists in ECR
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name eks-observable-platform-app \
            --region ap-south-2 \
            --image-ids imageTag=$TAG \
            > /dev/null
          echo "image $TAG found in ECR"

      - name: build kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-2 \
            --name eks-observable-platform

      - uses: azure/setup-helm@v4

      # Record whether production already exists and, when it does, the exact
      # healthy revision to restore if post-deploy validation fails.
      - name: record current production revision
        id: before
        shell: bash
        run: |
          set -euo pipefail

          REVISION="$(
            helm list \
              --namespace app-prod \
              --filter '^app-prod$' \
              --output json \
            | jq -r '.[0].revision // empty'
          )"

          if [ -n "$REVISION" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
            echo "current production revision: $REVISION"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "revision=" >> "$GITHUB_OUTPUT"
            echo "no existing app-prod release found"
          fi

      # --atomic handles FAILURE A: the rollout itself fails. bad image,
      # crash on startup, pods never Ready. helm reverts automatically.
      #
      # it does NOT handle FAILURE B: rollout succeeds but the app is broken.
      # a FAULT_MODE=true release passes --atomic perfectly - pods ready,
      # probes green. only the k6 gates below see that.
      - name: deploy to prod
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          helm upgrade --install app-prod ./application/helm \
            -f ./application/helm/values-prod.yaml \
            --set image.tag=$TAG \
            --namespace app-prod \
            --atomic \
            --wait \
            --timeout 5m

          echo "deployed $TAG to app-prod" >> $GITHUB_STEP_SUMMARY

      # fast fail. 20 seconds. if the release is fundamentally broken we
      # find out now rather than after three minutes of load testing.
      - name: smoke test
        id: smoke
        run: |
          NS=app-prod
          TARGET="http://app-prod.$NS.svc.cluster.local:8080"

          kubectl delete job k6-smoke -n $NS --ignore-not-found

          kubectl create configmap k6-smoke-script \
            --from-file=k6/app/smoke.js -n $NS \
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s|PLACEHOLDER|$TARGET|" k6/app/smoke-job.yaml | kubectl apply -n $NS -f -

          # `kubectl wait --for=condition=complete` never returns early on a
          # Failed job - it just waits out the full timeout. This polls both
          # conditions directly. See scripts/wait-for-job.sh.
          chmod +x scripts/wait-for-job.sh
          ./scripts/wait-for-job.sh k6-smoke $NS 120 \
            && RESULT=pass || RESULT=fail

          echo "--- k6 smoke output ---"
          kubectl logs job/k6-smoke -n $NS

          if [ "$RESULT" = "fail" ]; then
            echo "::error::smoke test failed"
            exit 1
          fi

      # sustained traffic. catches degradation a 20s check would miss,
      # and produces a visible error curve in grafana if things go wrong.
      - name: load test
        id: load
        run: |
          NS=app-prod
          TARGET="http://app-prod.$NS.svc.cluster.local:8080"

          kubectl delete job k6-load -n $NS --ignore-not-found

          kubectl create configmap k6-load-script \
            --from-file=k6/app/load.js -n $NS \
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s|PLACEHOLDER|$TARGET|" k6/app/load-job.yaml | kubectl apply -n $NS -f -

          chmod +x scripts/wait-for-job.sh
          ./scripts/wait-for-job.sh k6-load $NS 360 \
            && RESULT=pass || RESULT=fail

          echo "--- k6 load output ---"
          kubectl logs job/k6-load -n $NS

          if [ "$RESULT" = "fail" ]; then
            echo "::error::load test failed"
            exit 1
          fi

          echo "load test passed" >> $GITHUB_STEP_SUMMARY

      # FAILURE B recovery. Scoped to the k6 steps specifically - if the
      # deploy step failed instead, --atomic has already reverted and another
      # rollback could undo a healthy release.
      #
      # Existing production release:
      #   restore the exact healthy revision recorded before deployment.
      #
      # First-ever production release:
      #   there is no previous revision to restore, so remove the failed
      #   release instead.
      - name: recover on validation failure
        if: failure() && (steps.smoke.outcome == 'failure' || steps.load.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.before.outputs.exists }}" = "true" ]; then
            PREVIOUS_REVISION="${{ steps.before.outputs.revision }}"

            echo "::warning::validation failed - restoring app-prod revision ${PREVIOUS_REVISION}"

            helm rollback app-prod "${PREVIOUS_REVISION}" \
              --namespace app-prod \
              --wait \
              --timeout 5m

            NOW="$(
              helm list \
                --namespace app-prod \
                --filter '^app-prod$' \
                --output json \
              | jq -r '.[0].revision'
            )"

            echo "rollback created revision ${NOW}, restoring the state of revision ${PREVIOUS_REVISION}" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::validation failed on the first production release - removing app-prod"

            helm uninstall app-prod \
              --namespace app-prod \
              --wait

            echo "first production release failed validation; no previous revision existed, so the failed release was removed" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          kubectl get pods -n app-prod || true
          helm history app-prod -n app-prod || true
