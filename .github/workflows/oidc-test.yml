name: oidc-test

# manual only. throwaway - delete once it passes.
on:
  workflow_dispatch:
  push:
    branches:
      - aws-foundation
      
permissions:
  id-token: write   # lets the workflow request an OIDC token from github
  contents: read

jobs:
  prove-it-works:
    runs-on: ubuntu-latest
    steps:
      - name: show the raw token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref}'

      - name: assume the CI role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::756808989597:role/eks-observable-platform-ci
          aws-region: ap-south-2

      - name: who am i
        run: aws sts get-caller-identity

      - name: log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: push a throwaway image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker pull alpine:3.20
          docker tag alpine:3.20 $REGISTRY/eks-observable-platform-app:oidc-test
          docker push $REGISTRY/eks-observable-platform-app:oidc-test