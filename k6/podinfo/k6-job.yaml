apiVersion: v1
kind: Pod
metadata:
  name: k6-load
  namespace: k6-testing
spec:
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:latest
      args: ["run", "/scripts/load-test.js"]
      volumeMounts:
        - name: script
          mountPath: /scripts
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  volumes:
    - name: script
      configMap:
        name: k6-script
